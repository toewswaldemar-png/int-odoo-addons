<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <title>AIDA login list</title>
        <style>
            body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem auto; max-width: 32rem; padding: 0 1rem; }
            label { display: block; margin-top: 1rem; font-weight: 600; }
            input { box-sizing: border-box; width: 100%; padding: 0.4rem; margin-top: 0.25rem; }
            button { margin-top: 1.25rem; padding: 0.4rem 1rem; }
            #state { margin-top: 1rem; }
            .note { color: #555; }
        </style>
    </head>
    <body>
        <h1>AIDA login list</h1>
        <p class="note">
            Die Namen kommen aus Odoo. Ist die Erweiterung per Richtlinie eingerichtet, gelten deren Werte und diese Seite wird nicht gebraucht.
        </p>
        <label for="odooUrl">Adresse von Odoo</label>
        <input id="odooUrl" type="url" placeholder="http://odoo.example:8069" autocomplete="off" />
        <label for="token">Token der Liste</label>
        <input id="token" type="password" autocomplete="off" />
        <button id="save" type="button">Speichern und prüfen</button>
        <div id="state" role="status"></div>
        <script src="options.js"></script>
    </body>
</html>
