# pre-commit for Odoo 19 code: Ruff, Prettier, ESLint and standard hooks; see docs/pruefautomatik_2026-10-02.md and
# docs/odoo_regeln/odoo_regeln_coding_guidelines_2026-10-02.md (section 8).
# docs/, scripts/, tools/ (developer scripts, converter service) and shell/PHP scripts are not checked.
# Run: pre-commit run --files <files>   |   pre-commit run --all-files
exclude: |
  (?x)
  # Files and folders generated by bots/tools, library files, test samples
  \.svg$|/tests/([^/]+/)?cassettes/|^\.github/|^eslint\.config\.cjs$|^prettier\.config\.cjs$|
  /static/description/index\.html$|/static/(src/)?lib/|/build/|/dist/|/tests/samples/.*|
  (LICENSE.*|COPYING.*)|
  # Not module code
  ^docs/|^scripts/|^tools/|^CLAUDE\.md$|^Dockerfile$|^README\.md$|readme/.*\.(rst|md)$|
  # Generated and managed by Speckit (its manifests hold file hashes, do not reformat)
  ^\.specify/|^\.claude/skills/speckit-|
  # Third-party vendored code inside our modules
  /vendor/|
  # (last alternative must not end in '|': an empty alternative would match every file)
  ^\.git/
default_language_version:
  python: python3
  node: "22.9.0"
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier (with plugin-xml)
        entry: prettier
        args:
          - --write
          - --list-different
          - --ignore-unknown
        types: [text]
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|ts|xml|yaml|yml)$
        language: node
        additional_dependencies:
          - "prettier@3.6.2"
          - "@prettier/plugin-xml@3.4.2"
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint
        args:
          - --color
          - --fix
        verbose: true
        types: [javascript]
        language: node
        additional_dependencies:
          - "eslint@9.35.0"
          - "eslint-plugin-jsdoc@57.0.8"
          - "globals@16.0.0"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # exclude autogenerated files
        exclude: /README\.rst$|\.pot?$
      - id: end-of-file-fixer
        # exclude autogenerated files
        exclude: /README\.rst$|\.pot?$
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        # exclude files where underlines are not distinguishable from merge conflicts
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
