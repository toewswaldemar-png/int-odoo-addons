# pre-commit for new code (Odoo 19). Based on OCA/oca-addons-repo-template (odoo_version 19.0,
# use_ruff) at 0c2edf1; see docs/pruefautomatik_2026-10-02.md and
# docs/odoo_regeln/odoo_regeln_coding_guidelines_2026-10-02.md (section 8).
# Deviations from the OCA template (this is not an OCA repository):
# - no OCA packaging/README generation hooks (oca-gen-addon-readme, oca-fix-manifest-website,
#   oca-update-pre-commit-excluded-addons, oca-gen-external-dependencies, whool-init)
# - existing code is excluded (LEGACY block), docs and shell/PHP scripts are not checked
# Run: pre-commit run --files <files>   |   pre-commit run --all-files
exclude: |
  (?x)
  # Files and folders generated by bots/tools, library files, test samples
  \.svg$|/tests/([^/]+/)?cassettes/|^\.github/|^eslint\.config\.cjs$|^prettier\.config\.cjs$|
  /static/description/index\.html$|/static/(src/)?lib/|/build/|/dist/|/tests/samples/.*|
  (LICENSE.*|COPYING.*)|
  # Not module code
  ^docs/|^scripts/|^CLAUDE\.md$|^Dockerfile$|^README\.md$|readme/.*\.(rst|md)$|
  # Third-party vendored code inside our modules
  /vendor/|
  # LEGACY (existing code is not reformatted, see scripts/lint/sync_legacy_excludes.py)
  ^int_fleet_kanban_width/|
  ^int_generic/|
  ^int_legacy_erp_import/|
