# Ruff with Odoo's own ruff.toml (copied from the Odoo repository); see docs/pruefautomatik.md
# The hook does not rewrite files.
exclude: |
  (?x)
  \.svg$|/static/(src/)?lib/|/build/|/dist/|
  ^docs/|^tools/|^CLAUDE\.md$|^Dockerfile$|^README\.md$|
  /vendor/|
  ^\.git/
default_language_version:
  python: python3
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        # Odoo's ruff.toml lists these rules as advised but not enforced (header of the file).
        args: [--no-fix, "--ignore=B904,COM812,E741,EM101,I001,RET,RUF021,RUF102,TID252,TRY002,UP006,UP007"]
