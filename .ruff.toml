# ruff configuration for Odoo 19 code.
target-version = "py310"
line-length = 120
fix = true

[lint]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (limit: line-length above)
    "I",  # isort
    "UP",  # pyupgrade
]
extend-safe-fixes = ["UP008"]
# Odoo guideline prefers % over .format() (docs/odoo_regeln/odoo_regeln_coding_guidelines_2026-10-02.md, section 3); UP031
# (percent format) is therefore not wanted.
ignore = ["UP031"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py
"__manifest__.py" = ["B018"]  # useless expression

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
